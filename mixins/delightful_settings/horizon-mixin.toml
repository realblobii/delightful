[mod]
id = "delightful_settings"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "c9d474dd9116e84c243f8992d75c11314df56f06"

# The add-on list and the on/off state, compiled into the game beside the hooks.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game/native_hooks.rs"
name = "delightful"
source = "runtime.rs"

# Options > Mods > Delightful settings: one button per add-on.
[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# A turned-off add-on's items vanish from player inventories (see docs/SETTINGS.md).
[[injection]]
id = "inventory"
hook = "inventory_tick"
hook_version = 1
kind = "HEAD"
helper = "inventory.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "slot", ty = "i32", value = "slot" },
]
